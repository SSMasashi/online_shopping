[project]
name = "online-shopping"
version = "0.1.0"
description = "Amazonと楽天の最安値を振り分けるStreamlitアプリ"
readme = "README.md"
authors = [
    { name = "SSMasashi", email = "8341ogas34@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.58.0",
    "gspread>=6.2.1",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
